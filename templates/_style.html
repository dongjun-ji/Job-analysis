<style>
:root{
  --bg:#f3f1ec; --paper:#ffffff; --ink:#1a1d24; --muted:#6b7080; --line:#e6e2d9;
  --hero:#121826; --hero-ink:#ffffff; --hero-sub:#b9c0cf;
  --accent:#e8501f; --accent-ink:#ffffff; --sum-bg:#fdf4ea; --sum-line:#f3d9bd; --sum-title:#c2410c;
  --good:#1f7a4d; --good-bg:#e5f4ec; --mid:#9a6700; --mid-bg:#fbf1d6; --low:#8a8f9c; --low-bg:#eef0f3;
  --warn:#b42318; --warn-bg:#fde8e6; --link:#1d4ed8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1015; --paper:#171a21; --ink:#e9eaee; --muted:#9aa0ad; --line:#2a2e38;
    --hero:#05070c; --hero-ink:#ffffff; --hero-sub:#9aa3b5;
    --accent:#ff6a3d; --sum-bg:#231a12; --sum-line:#4a3420; --sum-title:#ff9a6b;
    --good:#5fd39a; --good-bg:#16291f; --mid:#f0c35a; --mid-bg:#2c2412; --low:#a3a8b3; --low-bg:#22262e;
    --warn:#ff8a7a; --warn-bg:#3a1a17; --link:#8ab4ff;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1015; --paper:#171a21; --ink:#e9eaee; --muted:#9aa0ad; --line:#2a2e38;
  --hero:#05070c; --hero-ink:#ffffff; --hero-sub:#9aa3b5;
  --accent:#ff6a3d; --sum-bg:#231a12; --sum-line:#4a3420; --sum-title:#ff9a6b;
  --good:#5fd39a; --good-bg:#16291f; --mid:#f0c35a; --mid-bg:#2c2412; --low:#a3a8b3; --low-bg:#22262e;
  --warn:#ff8a7a; --warn-bg:#3a1a17; --link:#8ab4ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;background:var(--paper);min-height:100vh}
a{color:var(--link);word-break:break-all}
.hero{background:var(--hero);color:var(--hero-ink);padding:40px 24px 32px}
.eyebrow{letter-spacing:.14em;font-size:13px;color:var(--hero-sub);font-weight:500}
.hero h1{margin:8px 0 10px;font-size:34px;font-weight:900;line-height:1.2}
.hero .meta{color:var(--hero-sub);font-size:15px}
.summary{background:var(--sum-bg);border-bottom:2px solid var(--sum-line);padding:24px}
.summary h2{color:var(--sum-title);font-size:19px;margin:0 0 10px}
.summary ul{margin:0;padding-left:20px}
.summary li{margin:6px 0;font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.kpi{background:var(--paper);border:1px solid var(--sum-line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:22px;font-weight:900}
.kpi span{font-size:12px;color:var(--muted)}
section{padding:28px 24px;border-bottom:1px solid var(--line)}
.sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.badge{background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12px;letter-spacing:.06em;padding:5px 12px;border-radius:999px}
.sec-head h2{margin:0;font-size:22px;font-weight:900}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:14px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--bg);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
.score{display:inline-block;font-weight:900;padding:2px 9px;border-radius:8px;white-space:nowrap}
.s-high{color:var(--good);background:var(--good-bg)}
.s-mid{color:var(--mid);background:var(--mid-bg)}
.s-low{color:var(--low);background:var(--low-bg)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--low-bg);color:var(--muted);margin-left:4px;white-space:nowrap}
.tag.re{background:var(--mid-bg);color:var(--mid)}
.tag.urgent{background:var(--warn-bg);color:var(--warn)}
.card{border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
.card h3{margin:0 0 4px;font-size:18px}
.card .sub{color:var(--muted);font-size:14px;margin-bottom:10px}
.card dl{margin:0;display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-size:14px}
.card dt{color:var(--muted)}
.card dd{margin:0}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 4px;font-size:12px;color:var(--muted)}
.bars div b{display:block;color:var(--ink);font-size:15px}
.rank{font-size:40px;font-weight:900;color:var(--accent);line-height:1;margin-right:6px}
.top h3{display:flex;align-items:baseline}
.quote{border-left:4px solid var(--accent);background:var(--sum-bg);padding:12px 14px;border-radius:0 10px 10px 0;margin:10px 0;font-size:15px}
ol.actions{padding-left:20px;margin:0}
ol.actions li{margin:10px 0}
.verdict{background:var(--hero);color:var(--hero-ink);padding:28px 24px}
.verdict h2{margin:0 0 8px;font-size:15px;color:var(--hero-sub);letter-spacing:.08em;font-weight:500}
.verdict p{margin:0;font-size:19px;font-weight:700;line-height:1.6}
.note{font-size:13px;color:var(--muted)}
.sources{font-size:13px}
.sources li{margin:4px 0}
footer{padding:20px 24px 40px;font-size:12px;color:var(--muted)}
@media (max-width:480px){
  .hero{padding:32px 16px 26px}.hero h1{font-size:28px}
  section,.summary,.verdict,footer{padding-left:16px;padding-right:16px}
  .kpi b{font-size:18px}
  .card dl{grid-template-columns:1fr}.card dt{margin-top:6px}
}
</style>
