name: Build Job Report

# Claude 예약 작업이 매일 아침 data/reports/YYYY-MM-DD.json을 올리면 자동으로 실행된다.
on:
  push:
    branches: [main]
    paths:
      - "data/reports/*.json"
      - "templates/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate and build report
        run: python scripts/generate_report.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "build: report $(ls data/reports | tail -1 | sed 's/.json//')"
            git push
          fi
